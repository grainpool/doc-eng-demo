name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Build before test: the vitest-pool-workers config serves the built
      # client assets, and the deployed-URL health test needs no secrets.
      - run: pnpm build

      # T2 staleness gate: regenerate the CLI introspection fixture from the
      # freshly built CLI and fail if the committed copy drifted.
      - run: pnpm cli:introspect

      - run: git diff --exit-code fixtures/

      - run: pnpm test

  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/relay-kernel
    steps:
      - uses: actions/checkout@v4

      # Same interpreter line as the pinned image (python:3.12-slim); the
      # exact package set comes from the same requirements.txt the image uses.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/relay-kernel/requirements.txt
            packages/relay-kernel/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: python -m pytest tests -q
