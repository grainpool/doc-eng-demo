<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concord — run report</title>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  code, pre { font-family: ui-monospace, monospace; background: #f4f4f0; }
  pre { padding: .75rem; overflow-x: auto; }
  .impact { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin: 1rem 0; }
  .action { font-weight: 700; }
  .DETERMINISTIC_REGEN { color: #1a7f37; }
  .NO_ACTION { color: #6a737d; }
  .UNRESOLVED_CONFLICT, .EDITORIAL_REVIEW { color: #b35900; }
  .muted { color: #666; font-size: .9em; }
  input { padding: .4rem; width: 24rem; max-width: 100%; }
  button { padding: .4rem .8rem; }
</style>
</head>
<body>
<h1>Concord run report</h1>
<p class="muted">Paste a run id, or start a run against the live Relay product truth. See also the <a href="/facts.html">fact-graph explorer</a>.</p>
<p>
  <input id="runId" placeholder="run_…" />
  <button id="load">Load</button>
  <button id="start">Start new run</button>
</p>
<div id="out"></div>
<script>
const out = document.getElementById("out");
function esc(s) { const d = document.createElement("div"); d.textContent = String(s); return d.innerHTML; }
async function load(id) {
  const res = await fetch("/api/public/runs/" + encodeURIComponent(id));
  if (!res.ok) { out.innerHTML = "<p>run not found</p>"; return; }
  const data = await res.json();
  const patchById = Object.fromEntries((data.patches ?? []).map(p => [p.id, p]));
  const REPO1 = "https://github.com/grainpool/doc-eng-demo/blob/main/";
  function evidencePanel(patch) {
    if (!patch || !patch.evidence_json) return "";
    let items = [];
    try { items = JSON.parse(patch.evidence_json); } catch { return ""; }
    return "<div style='border:1px solid #cbd5e1;background:#f8fafc;border-radius:6px;padding:.6rem .9rem;margin:.5rem 0'>" +
      "<b>Evidence</b>" + items.map(e =>
        "<div class='muted'>• <code>" + esc(e.fact_key) + "</code> (" + esc(e.tier) + ") = <code>" +
        esc(JSON.stringify(e.value)) + "</code> — <a href='" + REPO1 + esc(String(e.locator).split("#")[0]) +
        "'>" + esc(e.locator) + "</a> · observed " + esc(e.observed_at) + "</div>").join("") + "</div>";
  }
  function patchBlock(patch) {
    if (!patch) return "";
    return "<div class='muted'>patch <b>" + esc(patch.origin ?? "deterministic") + "</b>" +
      (Number(patch.requires_review) ? " · <span style='color:#b35900'>REVIEW REQUIRED — never auto-applied</span>" : " · may auto-apply") +
      (patch.changed_because ? "<br>why: " + esc(patch.changed_because) : "") +
      (patch.needs_human_because ? "<br>needs a human: " + esc(patch.needs_human_because) : "") +
      "</div>" + evidencePanel(patch) + "<pre>" + esc(patch.unified) + "</pre>";
  }
  const ORDER = ["DETERMINISTIC_REGEN", "GROUNDED_PATCH", "EDITORIAL_REVIEW", "UNRESOLVED_CONFLICT", "NO_ACTION"];
  const groups = ORDER.map(action => [action, (data.impacts ?? []).filter(i => i.action === action)])
    .filter(([, list]) => list.length > 0);
  out.innerHTML =
    "<h2>" + esc(data.run.id) + " — " + esc(data.run.status) +
    (data.run.reason ? " <span class='muted'>(" + esc(data.run.reason) + ")</span>" : "") + "</h2>" +
    "<p class='muted'>started " + esc(data.run.started_at) +
    (data.estimated_cost_usd != null ? " · estimated model cost $" + esc(data.estimated_cost_usd) : "") + "</p>" +
    ((data.model_calls ?? []).length
      ? "<p class='muted'>" + data.model_calls.map(m =>
          esc(m.purpose) + ": " + esc(m.calls) + " call(s), " + esc(m.input_tokens) + " in / " +
          esc(m.output_tokens) + " out, cache " + esc(m.cache_read ?? 0) + " read / " +
          esc(m.cache_creation ?? 0) + " written").join(" · ") + "</p>"
      : "") +
    (data.warnings ?? []).map(w =>
      "<div class='impact' style='border-color:#b35900'><b>⚠ " + esc(w.kind) + "</b> <code>" + esc(w.path) + "</code>" +
      "<p class='muted'>" + esc(w.detail) + "</p></div>").join("") +
    groups.map(([action, impacts]) =>
      "<h3><span class='action " + esc(action) + "'>" + esc(action) + "</span> (" + impacts.length + ")</h3>" +
      impacts.map(impact => {
        const patch = impact.patch_id ? patchById[impact.patch_id] : null;
        return "<div class='impact'>" +
          "<div><span class='muted'>rule " + esc(impact.classification_rule) +
          " · disposition " + esc(impact.disposition ?? "—") +
          (impact.resolution_note ? " · " + esc(impact.resolution_note) : "") + "</span></div>" +
          "<div><code>" + esc(impact.fact_key) + "</code> → <code>" + esc(impact.doc_unit_id) + "</code></div>" +
          "<div class='muted'>Δ " + esc(impact.delta_json) + "</div>" +
          "<p>" + esc(impact.explanation) + "</p>" +
          patchBlock(patch) +
          "</div>";
      }).join("")).join("") +
    ((data.conflicts ?? []).length
      ? "<h3>Escalations — conflicts (" + data.conflicts.length + ")</h3>" +
        "<p class='muted'>Concord never resolves a conflict. Each names its owner, what is missing, and the question to ask.</p>" +
        data.conflicts.map(c => {
          let claims = []; let missing = [];
          try { claims = JSON.parse(c.claims_json); missing = JSON.parse(c.missing_information_json); } catch {}
          return "<div class='impact' style='border-color:#b30000'>" +
            "<div><b>" + esc(c.kind) + "</b> <code>" + esc(c.fact_key) + "</code>" +
            " · likely owner <b>" + esc(c.likely_owner) + "</b>" +
            " · resolution: <code>" + (c.resolution === null ? "null (always)" : esc(c.resolution)) + "</code></div>" +
            "<div style='display:flex;gap:1rem;flex-wrap:wrap;margin:.5rem 0'>" +
            claims.map(cl => "<div style='flex:1;min-width:16rem;border:1px solid #ddd;border-radius:6px;padding:.5rem .8rem'>" +
              "<b>" + esc(cl.tier) + "</b> claims <code>" + esc(JSON.stringify(cl.value)) + "</code>" +
              "<div class='muted'>" + esc(cl.locator) + "</div></div>").join("") + "</div>" +
            "<div class='muted'>Missing: " + missing.map(esc).join(" · ") + "</div>" +
            "<p><b>Suggested question:</b> " + esc(c.suggested_question) + "</p></div>";
        }).join("")
      : "") +
    (() => {
      const active = (data.findings ?? []).filter(f => f.disposition !== "suppressed");
      const suppressed = (data.findings ?? []).filter(f => f.disposition === "suppressed");
      return (active.length
        ? "<h3>Findings (" + active.length + ")</h3>" + active.map(f =>
            "<div class='impact'><b>" + esc(f.kind) + "</b> <code>" + esc(f.fact_key) + "</code>" +
            (f.owner ? " <span class='muted'>owner " + esc(f.owner) + "</span>" : "") +
            "<p class='muted'>" + esc(f.detail) + "</p></div>").join("")
        : "") +
      (suppressed.length
        ? "<h3>Suppressed findings (" + suppressed.length + ")</h3>" +
          "<p class='muted'>Refuted by the adversarial falsifier — stored and shown, never deleted.</p>" +
          suppressed.map(f =>
            "<div class='impact' style='opacity:.75;border-style:dashed'><b>" + esc(f.kind) + "</b> <code>" + esc(f.fact_key) + "</code>" +
            "<p class='muted'>" + esc(f.detail) + "</p>" +
            "<p><b>Refutation:</b> " + esc(f.refutation ?? "(none recorded)") + "</p></div>").join("")
        : "");
    })() +
    "<h3>Steps</h3><pre>" + esc(JSON.stringify(data.steps, null, 2)) + "</pre>";
}
document.getElementById("load").onclick = () => load(document.getElementById("runId").value.trim());
document.getElementById("start").onclick = async () => {
  const res = await fetch("/api/runs", { method: "POST" });
  const data = await res.json();
  document.getElementById("runId").value = data.run_id;
  // Queued runs (Phase 14): poll until the consumer finishes.
  out.innerHTML = "<p class='muted'>run " + esc(data.run_id) + " queued…</p>";
  for (let i = 0; i < 120; i++) {
    await new Promise(r => setTimeout(r, 2500));
    const check = await fetch("/api/public/runs/" + encodeURIComponent(data.run_id));
    if (!check.ok) continue;
    const body = await check.json();
    if (["completed", "failed", "partial"].includes(body.run.status)) break;
    out.innerHTML = "<p class='muted'>run " + esc(data.run_id) + " " + esc(body.run.status) + "…</p>";
  }
  await load(data.run_id);
};
</script>
</body>
</html>
